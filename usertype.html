<!DOCTYPE html><!usertypescreen.html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select User Type</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
 @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background:  #A5D6E2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container */
        .container {
            background:#fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Heading */
        h2 {
            color: #34558B; /* Coral for headings */
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* User Type Buttons */
        .user-type {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .user-option {
            display: flex;
            align-items: center;
            background-color: #f1f8e9; /* Soft pastel green */
            padding: 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            transition: 0.3s ease;
            text-decoration: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .user-option:hover {
            background-color: #A5D6E2; /* Coral on hover */
            color: white;
            transform: translateY(-5px); /* Lift effect on hover */
        }

        /* Icon */
        .user-option i {
            font-size: 24px;
            margin-right: 10px;
            color:  #34558B; /* Coral for icons */
            transition: 0.3s ease;
        }

        .user-option:hover i {
            color: white; /* White on hover */
        }

        /* Responsive Design */
        @media screen and (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .user-option {
                font-size: 16px;
                padding: 12px;
                color :  #A5D6E2;
            }
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Choose Your Role</h2>
        <div class="user-type">
            <a href="vet.html" class="user-option">
                <i class='bx bxs-first-aid'></i> Vet Expert
            </a>
            <a href="store.html" class="user-option">
                <i class='bx bxs-store'></i> Animal Sales Store
            </a>
            <a href="rescue.html" class="user-option">
                <i class='bx bxs-heart'></i> Rescue Team
            </a>
            <a href="regular.html" class="user-option">
                <i class='bx bxs-user'></i> Regular Pet Owner
            </a>
            <a href="petlover.html" class="user-option">
                <i class='bx bxs-heart-circle'></i> Pet Lover
            </a>
            

        </div>
    </div>

</body>
</html>
